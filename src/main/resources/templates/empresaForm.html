<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

	<title>Empresa</title>

</head>

<body>

	<div class="container mt-5">

		<div class="row justify-content-center">

			<div class="col-md-6">

				<div class="card shadow-sm">

					<div class="card-body p-4">

						<h1 class="h3 mb-4"
							th:text="${empresa.idEmpresa == null ? 'Registrar empresa' : 'Editar empresa'}">
							Registrar empresa
						</h1>

						<form th:action="@{/empresa/guardar}" th:object="${empresa}" method="post">

							<input type="hidden" th:field="*{idEmpresa}">

							<div class="mb-3">

								<label for="nombre" class="form-label">
									Nombre de empresa
								</label>

								<input type="text" id="nombre" class="form-control" th:field="*{nombre}"
									placeholder="Ingrese el nombre de la empresa" required>

							</div>

							<div class="d-flex gap-2">

								<button type="submit" class="btn btn-primary">
									Guardar
								</button>

								<a th:href="@{/empresa/empresas}" class="btn btn-outline-secondary">
									Cancelar
								</a>

							</div>

						</form>

					</div>

				</div>

			</div>

		</div>

	</div>

</body>

</html>
